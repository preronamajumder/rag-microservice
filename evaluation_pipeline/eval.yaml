name: llm-eval
on:
  pull_request:
    paths: ["prompts/**", "config/**", "dataset.jsonl", "*.py", "baseline.json"]
  schedule:
    - cron: "0 3 * * *"      # nightly run catches drift (model/provider changes you did not make)
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Run eval suite
        env:
          LLM_BACKEND: openai                      # any OpenAI-compatible endpoint
          OPENAI_API_KEY: ${{ secrets.EVAL_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: python run_eval.py --threshold 0      # never fails here; compare.py is the gate
      - name: Regression gate
        run: python compare.py --floor 0.8 --max-drop 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: results/ }